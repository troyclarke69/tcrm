version: "3.9"

services:
  db:
    image: postgres:16
    container_name: tcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Tcrm.Api/Dockerfile
    container_name: tcrm-api
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=tcrm;Username=postgres;Password=postgres
      Jwt__Issuer: TCRM
      Jwt__Audience: TCRM.Client
      Jwt__Key: super-secret-development-key-change-me
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tcrm-frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
